services:
  mysql:
    image: mysql:8.0
    container_name: ai-job-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ai_job
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ai-job-mysql-data:/var/lib/mysql
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-job-net

  ai-job:
    container_name: ai-job
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9100:9100"
      - "6768:6768"
    volumes:
      - ai-job-logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - mysql.host=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
    command:
      - /app/ai-job.jar
      - --smart.config.webui.port=6768
      - --smart.config.desc.infer=true
    networks:
      - ai-job-net

# Remote SSL extension: for non-local deployments, put nginx in front of port
# 9100 with a certificate and point the userscript default server to that HTTPS
# domain. Localhost does not need SSL.
volumes:
  ai-job-mysql-data:
  ai-job-logs:

networks:
  ai-job-net:
